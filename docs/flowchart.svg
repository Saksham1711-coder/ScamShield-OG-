<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1320" viewBox="0 0 1100 1320" role="img" aria-labelledby="title desc">
<title id="title">ScamShield: practice safer payment decisions</title><desc id="desc">Choose learning, sample scam updates or practice payments. Validate the fictional payment, assess risk, block high risk, require review for lower risk and extra acknowledgment for medium risk, then recheck and save a fictional receipt.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5d7768"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203b31}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#637469}.label{font-size:18px;font-weight:600}.small{font-size:14px;fill:#637469}.tiny{font-size:12px;fill:#637469}.line{fill:none;stroke:#5d7768;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#d5dfd0;stroke-width:1.5}</style></defs>
<rect width="1100" height="1320" fill="#f4f6f2"/>
<text x="65" y="70" class="title">A pause before every payment.</text><text x="65" y="103" class="sub">ScamShield · Offline educational prototype · All recipients and points are fictional</text>
<rect x="405" y="148" width="290" height="67" rx="20" fill="#164d40"/><text x="550" y="189" text-anchor="middle" class="label" style="fill:#fff">Open ScamShield</text>
<path d="M550 215V246H220V271" class="line"/><path d="M550 215V271" class="line"/><path d="M550 215V246H880V271" class="line"/>
<rect x="70" y="274" width="300" height="90" rx="18" class="box"/><text x="220" y="310" text-anchor="middle" class="label">Learn &amp; practice</text><text x="220" y="336" text-anchor="middle" class="small">Search guides · Take a short quiz</text>
<rect x="400" y="274" width="300" height="90" rx="18" fill="#e6f0d6" stroke="#c3d5ad"/><text x="550" y="310" text-anchor="middle" class="label">Set up a demo payment</text><text x="550" y="336" text-anchor="middle" class="small">Recipient · Points · Fictional context</text>
<rect x="730" y="274" width="300" height="90" rx="18" class="box"/><text x="880" y="310" text-anchor="middle" class="label">Explore scam patterns</text><text x="880" y="336" text-anchor="middle" class="small">Sample stories · Not a live feed</text>
<path d="M550 364V402" class="line"/><rect x="375" y="405" width="350" height="91" rx="18" class="box"/><text x="550" y="439" text-anchor="middle" class="label">Validate payment details</text><text x="550" y="465" text-anchor="middle" class="small">Known demo recipient · Positive whole points</text><text x="550" y="483" text-anchor="middle" class="tiny">Sufficient balance required</text>
<path d="M375 450H295V320H397" class="line"/><text x="281" y="411" text-anchor="end" class="small">Invalid?</text><text x="281" y="432" text-anchor="end" class="small">Edit details</text>
<path d="M550 496V535" class="line"/><rect x="330" y="539" width="440" height="98" rx="18" class="box"/><text x="550" y="571" text-anchor="middle" class="label">Evaluate local demo signals</text><text x="550" y="598" text-anchor="middle" class="small">Profile age · Reports · Name match</text><text x="550" y="621" text-anchor="middle" class="small">Urgency · Threats · Guarantees · Secrecy · Access</text>
<path d="M550 637V674H220V708" class="line"/><path d="M550 637V708" class="line"/><path d="M550 637V674H880V708" class="line"/>
<rect x="70" y="712" width="300" height="143" rx="18" fill="#edf4e3" stroke="#c7d9b2"/><text x="220" y="750" text-anchor="middle" class="label">Lower risk</text><text x="220" y="779" text-anchor="middle" class="small">Review recipient and signals</text><text x="220" y="804" text-anchor="middle" class="small">Acknowledge the limits</text><text x="220" y="834" text-anchor="middle" class="tiny">Lower risk does not mean safe</text>
<rect x="400" y="712" width="300" height="143" rx="18" fill="#fcf2df" stroke="#e6d4ad"/><text x="550" y="750" text-anchor="middle" class="label">Medium risk</text><text x="550" y="779" text-anchor="middle" class="small">Review recipient and signals</text><text x="550" y="804" text-anchor="middle" class="small">Extra acknowledgment required</text><text x="550" y="834" text-anchor="middle" class="tiny">Pause and independently verify</text>
<rect x="730" y="712" width="300" height="143" rx="18" fill="#f9e8e9" stroke="#e2bcc0"/><text x="880" y="750" text-anchor="middle" class="label">High risk → Blocked</text><text x="880" y="779" text-anchor="middle" class="small">No points move · No override</text><text x="880" y="804" text-anchor="middle" class="small">Edit scenario or return to learning</text><text x="880" y="834" text-anchor="middle" class="tiny">Optional report stays on this device</text>
<path d="M220 855V891H550V923" class="line"/><path d="M550 855V923" class="line"/>
<rect x="345" y="926" width="410" height="91" rx="18" class="box"/><text x="550" y="961" text-anchor="middle" class="label">Recheck before moving points</text><text x="550" y="988" text-anchor="middle" class="small">Risk · Balance · Unique transaction reference</text>
<path d="M755 972H823" class="line"/><text x="848" y="963" class="small">If a check fails:</text><text x="848" y="988" class="small">show error, no points moved</text>
<path d="M550 1017V1057" class="line"/><rect x="345" y="1060" width="410" height="93" rx="18" fill="#164d40"/><text x="550" y="1097" text-anchor="middle" class="label" style="fill:#fff">Save a fictional receipt</text><text x="550" y="1126" text-anchor="middle" class="small" style="fill:#d7e6d7">Update wallet · View history · Practice again</text>
<line x1="65" x2="1035" y1="1200" y2="1200" stroke="#d5dfd0"/><text x="65" y="1231" class="small">No bank connection. No real identity verification. No real money. No live alerts.</text><text x="65" y="1257" class="small">Simple rules support learning; they cannot establish that a person or payment is safe.</text>
</svg>
